[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eds-rag"
version = "0.1.0"
description = "Hybrid RAG schema retrieval + guarded read-only SQL tools (MCP) for the EDS SQL Server database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.0"]
fastembed = ["fastembed>=0.3"]
voyage = ["voyageai>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
eds-rag = "eds_rag.cli:main"

[tool.setuptools.packages.find]
include = ["eds_rag*"]

[tool.setuptools.package-data]
eds_rag = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
